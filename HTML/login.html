<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Style.css">
</head>
<body>

  <div class="app-container">
    <a href="onboarding3.html" class="back-arrow">←</a>
    
    <div class="auth-container">
      <h2 class="logo-text-sm" style="text-align: center;">StudyFlow</h2>
      <p class="tagline-sm" style="text-align: center;">Stay Focused</p>
      
      <form class="auth-form" id="loginForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="Enter Email" required>
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter Password" required>
        </div>
        
        <div style="text-align: right; margin-top: -8px; margin-bottom: 16px;">
  <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--primary-blue); text-decoration: none; font-weight: 500;">
    Forgot Password?
  </a>
</div>
        

        <button type="submit" class="btn-primary">Login</button>
      </form>
      
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <script src="../JS/app.js"></script>
</body>
</html>
