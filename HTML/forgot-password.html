<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Recover Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Style.css">
</head>
<body>

  <div class="app-container">
    <div class="tasks-header-row" style="display: flex; align-items: center; gap: 16px; margin-bottom: 28px;">
      <a href="login.html" style="text-decoration: none; font-size: 1.5rem; color: var(--text-dark);">←</a>
      <h2>Account Recovery</h2>
    </div>

    <div id="recoveryRequestStep" class="auth-card-wrapper" style="background: var(--card-bg); border-radius: var(--border-radius); padding: 24px; box-sizing: border-box;">
      <p style="margin: 0 0 20px 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
        Enter your registered academic email address below. We will generate an authorization security token to reset your credentials.
      </p>
      
      <form id="forgotPasswordRequestForm">
        <div style="margin-bottom: 18px;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px;">University Email</label>
          <input type="email" id="recoveryEmailInput" placeholder="username@university.edu" required style="width: 100%; padding: 12px; border: 1px solid #E2E7FF; border-radius: 8px; font-family: 'Poppins', sans-serif; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 600;">
          Generate Recovery Token
        </button>
      </form>
    </div>

    <div id="recoveryResetStep" class="auth-card-wrapper" style="background: var(--card-bg); border-radius: var(--border-radius); padding: 24px; box-sizing: border-box; display: none;">
      <p style="margin: 0 0 16px 0; font-size: 0.85rem; color: #0047CC; font-weight: 600; background: #EBF3FF; padding: 10px; border-radius: 6px;" id="tokenNotificationBanner">
        </p>

      <form id="forgotPasswordResetForm">
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px;">Enter Security Token</label>
          <input type="text" id="recoveryTokenInput" placeholder="Paste security token here" required style="width: 100%; padding: 12px; border: 1px solid #E2E7FF; border-radius: 8px; font-family: 'Poppins', sans-serif; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px;">New Secure Password</label>
          <input type="password" id="recoveryNewPasswordInput" placeholder="••••••••" required style="width: 100%; padding: 12px; border: 1px solid #E2E7FF; border-radius: 8px; font-family: 'Poppins', sans-serif; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); margin-bottom: 6px;">Confirm New Password</label>
          <input type="password" id="recoveryConfirmPasswordInput" placeholder="••••••••" required style="width: 100%; padding: 12px; border: 1px solid #E2E7FF; border-radius: 8px; font-family: 'Poppins', sans-serif; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 600; background: #34C759;">
          Save New Password
        </button>
      </form>
    </div>

  </div>

  <script src="../JS/app.js"></script>
</body>
</html>
