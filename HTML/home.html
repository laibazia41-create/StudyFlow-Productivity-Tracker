<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Home Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Style.css">
</head>
<body>

  <div class="app-container">
    
    <div class="home-user-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;">
      <div>
        <h1 id="userGreetingHeading" style="margin: 0 0 4px 0; font-size: 1.6rem; color: var(--text-dark);">Hi, Scholar 👋</h1>
        <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">Let's hit your study milestones today!</p>
        <button type="button" id="deleteAvatarBtnHome" style="background: transparent; border: none; color: #FF3B30; font-family: 'Poppins', sans-serif; font-size: 0.75rem; font-weight: 600; margin-top: 6px; padding: 0; cursor: pointer; display: none;">
          🗑️ Remove Photo
        </button>
      </div>
      
      <a href="profile.html" style="text-decoration: none;">
        <div class="profile-avatar-circle" id="homeAvatarDisplay" style="width: 52px; height: 52px; border-radius: 50%; background-color: #E2E7FF; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--primary-blue);">
          <span id="homeAvatarDefaultEmoji" style="font-size: 1.4rem;">👤</span>
        </div>
      </a>
    </div>

    <div class="progress-card-metric" style="background: var(--card-bg); border-radius: var(--border-radius); padding: 18px; margin-bottom: 24px; box-sizing: border-box;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-dark);">Today's Focused Time</span>
        <span id="homeStudyTimeLabel" style="font-size: 0.85rem; font-weight: 700; color: var(--primary-blue);">0h 0m <span class="target-stat" style="color: var(--text-muted); font-weight:400;">/ 4h</span></span>
      </div>
      <div class="progress-track-bar" style="background: #E2E7FF; height: 8px; border-radius: 4px; overflow: hidden;">
        <div id="homeProgressFillBar" class="progress-fill-node" style="background: var(--primary-blue); height: 100%; width: 0%; transition: width 0.4s ease;"></div>
      </div>
    </div>

    <div class="features-action-grid" style="display: grid; grid-template-columns: 1xl 1fr; gap: 16px; margin-bottom: 28px;">
      <a href="timer.html" class="feature-card-node" style="background: #EBF3FF; text-decoration: none; padding: 16px; border-radius: var(--border-radius); display: flex; align-items: center; gap: 14px;">
        <div style="font-size: 1.8rem;">⏱️</div>
        <div>
          <h4 style="margin: 0 0 2px 0; color: #0047CC;">Study Timer</h4>
          <p style="margin: 0; font-size: 0.75rem; color: #4D88FF;">Focus with Pomodoro</p>
        </div>
      </a>
    </div>

    <div class="tasks-preview-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-dark);">Pending Targets</h3>
        <a href="tasks.html" style="font-size: 0.85rem; font-weight: 600; color: var(--primary-blue); text-decoration: none;">View All</a>
      </div>
      
      <div id="dynamicHomeTaskList" class="vertical-task-stack" style="display: flex; flex-direction: column; gap: 10px;">
        </div>
    </div>

  </div>

  <script src="../JS/app.js"></script>
</body>
</html>
