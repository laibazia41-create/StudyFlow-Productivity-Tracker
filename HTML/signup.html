<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/Style.css">
</head>
<body>

  <div class="app-container">
    <a href="login.html" class="back-arrow">←</a>
    
    <div class="auth-container">
      <h2 class="logo-text-sm" style="text-align: center; margin-bottom: 5px;">Create Account</h2>
      <p class="tagline-sm" style="text-align: center;">Join StudyFlow today</p>
      
      <form class="auth-form" id="signupForm">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Enter Full Name" required>
        </div>
        
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="Enter Email" required>
        </div>
        
        <div class="input-group">
          <label>Set Password</label>
          <input type="password" id="signupPassword" placeholder="Set a strong password" required>
        </div>
        
        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
        </div>
        
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
      
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="../JS/app.js"></script>
</body>
</html>
